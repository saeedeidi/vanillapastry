body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(500px 380px at 8% 6%,rgba(102,155,188,.35),transparent 70%),radial-gradient(520px 420px at 95% 20%,rgba(165,0,33,.16),transparent 70%),radial-gradient(600px 500px at 40% 100%,rgba(250,243,227,.95),transparent 70%),radial-gradient(420px 360px at 100% 95%,rgba(20,36,107,.14),transparent 70%)}
.wrap{max-width:1280px;margin:0 auto;padding:14px}
.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--bd);border-radius:20px;box-shadow:0 8px 32px rgba(20,36,107,.09),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(20,36,107,.04)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;margin-bottom:12px}
h1{font-size:18px;margin:0;font-weight:800}h1 span{color:var(--red)}
.sub{color:var(--mute);font-size:12px;margin-top:2px}

.bar{padding:12px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.bar label{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;font-weight:500}
input,select{font:inherit;color:var(--ink);background:rgba(255,255,255,.8);border:1px solid var(--ln);border-radius:12px;padding:7px 10px;outline:none}
input:focus,select:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(102,155,188,.25)}
input[type=number]{width:70px;text-align:center}
.search{flex:1;min-width:180px}.search input{width:100%}.par input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:#a50021}
.note{font-size:11.5px;color:var(--mute);flex-basis:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--ln);background:rgba(255,255,255,.7);border-radius:99px;padding:6px 13px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 4px 12px rgba(20,36,107,.3)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi{padding:14px 16px}.kpi small{color:var(--mute);font-size:11.5px}.kpi b{display:block;font-size:20px;margin-top:4px;font-weight:800}
.kpi.r b{color:var(--red)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px;margin-bottom:12px;scrollbar-width:none}
.tab{flex:none;border:0;background:transparent;font:inherit;font-weight:500;color:var(--mute);padding:9px 16px;border-radius:14px;cursor:pointer;white-space:nowrap}
.tab.on{background:linear-gradient(135deg,var(--red),#c4163a);color:#fff;box-shadow:0 6px 16px rgba(165,0,33,.3)}
.tab i{font-style:normal;background:rgba(20,36,107,.1);border-radius:99px;padding:1px 7px;margin-right:5px;font-size:11px}.tab.on i{background:rgba(255,255,255,.25)}
.sec{padding:14px;margin-bottom:12px}.sec h2{font-size:15px;margin:0 0 4px}.sec p{margin:0 0 12px;color:var(--mute);font-size:12px}
.bgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.bc{padding:12px}.bc b{font-size:13px}.bc small{display:block;color:var(--mute);font-size:11px;margin:3px 0 8px}
.sb{display:flex;height:9px;border-radius:9px;overflow:hidden;background:rgba(20,36,107,.08)}.sb span{display:block}
.sc{display:flex;gap:8px;font-size:11px;margin-top:6px;color:var(--mute)}
.tw{overflow:auto;max-height:70vh;border-radius:14px;border:1px solid var(--ln);background:rgba(255,255,255,.5)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th{position:sticky;top:0;z-index:2;background:rgba(250,243,227,.95);font-weight:700;padding:9px 8px;white-space:nowrap;border-bottom:1px solid var(--ln);text-align:center}
td{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:center;white-space:nowrap}
td.n,th.n{text-align:right;position:sticky;right:0;z-index:1;background:rgba(255,255,255,.95);min-width:170px;max-width:230px;white-space:normal;line-height:1.5}
th.n{z-index:3;background:rgba(250,243,227,.98)}
tr.cl{cursor:pointer}tr.cl:hover td.n{background:var(--cream)}
.cc{display:inline-block;font-size:10.5px;border-radius:99px;padding:1px 9px;margin-top:3px;border:1px solid var(--ln);background:rgba(20,36,107,.05);color:var(--mute)}.cc.bar{background:rgba(102,155,188,.16);color:#3f6f8f}.cc.kit{background:rgba(120,120,140,.13);color:#666679}
.cell{border-radius:9px;padding:4px 6px;min-width:100px;display:inline-block;font-weight:700;direction:ltr}
.cell small{display:block;font-weight:400;font-size:10px;opacity:.8}
.ex td{background:rgba(250,243,227,.6);padding:10px}
.ex table{font-size:12px}.ex th{position:static}
.pos{color:var(--red)}.neg{color:var(--navy)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.cd{padding:12px;border-radius:16px;background:rgba(255,255,255,.7);border:1px solid var(--ln)}
.cd b{font-size:13px;line-height:1.6}.cd .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cr{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--ln);font-size:13px}.cr:last-child{border:0}.cd .ct{margin-top:8px}.empty{padding:26px;text-align:center;color:var(--mute)}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mute);margin-bottom:10px;align-items:center}
.leg i{display:inline-block;width:14px;height:14px;border-radius:5px;vertical-align:-3px;margin-left:4px}
@media(max-width:760px){.wrap{padding:8px}.kpis{grid-template-columns:repeat(2,1fr)}.bgrid{grid-template-columns:repeat(2,1fr)}.kpi b{font-size:16px}h1{font-size:15px}.bar label{flex:1 1 44%}input[type=number]{width:100%}td.n,th.n{min-width:130px;max-width:150px}.tw{max-height:62vh}}
